name: Consolidate cleanup batch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: consolidate-cleanup-batch
  cancel-in-progress: false
jobs:
  migrate:
    if: github.actor == '476139183'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      KNOWLEDGE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - name: Import source snapshots
        run: |
          cp scripts/cleanup-batch/inventory.json /tmp/batch-sources-inventory.json
          python3 scripts/cleanup-batch/import_snapshots.py
      - name: Preserve all source branches and tags
        run: python3 scripts/cleanup-batch/preserve_histories.py
      - name: Build category and source indexes
        run: python3 scripts/cleanup-batch/build_catalog.py
      - name: Verify all archived files and histories
        run: python3 scripts/verify_collections.py
      - name: Publish verified consolidation
        run: |
          git config user.name '476139183'
          git config user.email '476139183@users.noreply.github.com'
          mkdir -p .git/info
          echo 'collections/** -text -filter -ident' >> .git/info/attributes
          git -c core.autocrlf=false add --force collections catalog README.md SOURCES.md scripts/verify_collections.py
          python3 scripts/cleanup-batch/verify_staged.py
          git commit -m '归纳合并学习资料并保留来源分支及标签历史'
          git push --atomic origin HEAD:refs/heads/master 'refs/tags/legacy/*:refs/tags/legacy/*'
